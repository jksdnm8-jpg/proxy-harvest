name: ci

on:
  # 只在分支上跑：推送 tag 时不该重跑该 tag 所属历史提交的 CI，
  # 那些提交的 workflow 是旧版本（例如还用 3.9 矩阵），必然失败。
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows 和 Ubuntu 都跑完整回归；macOS 暂未纳入。
        # 3.9 已 EOL，actions/python-versions 不再为 ubuntu-26.04 提供 3.9 构建，
        # setup-python 会直接失败；CI 最低版本提到 3.10。3.15 太新暂不纳入。
        # 代码本身仍声明 >=3.9（见 pyproject.toml），只是 CI 不再覆盖 3.9。
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest test_parse

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python compat_matrix.py --mihomo mock_mihomo.py --json-out compat.json
      - uses: actions/upload-artifact@v7
        with:
          name: compat-matrix
          path: compat.json
