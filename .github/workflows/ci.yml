name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows 和 Ubuntu 都跑完整回归；macOS 暂未纳入。
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest test_parse

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python compat_matrix.py --mihomo mock_mihomo.py --json-out compat.json
      - uses: actions/upload-artifact@v4
        with:
          name: compat-matrix
          path: compat.json
